services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduflow
      POSTGRES_PASSWORD: eduflow_dev_password
      POSTGRES_DB: eduflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://eduflow:eduflow_dev_password@db:5432/eduflow
      JWT_SECRET: dev-only-secret-change-in-production-32bytes
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:26-alpine
    working_dir: /work
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/work
    depends_on:
      - backend

volumes:
  pgdata:
